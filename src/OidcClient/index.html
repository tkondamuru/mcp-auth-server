<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PGW OIDC MCP Client Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 0% 0%, #1e1b4b 0%, #0f172a 100%);
            --card-bg: rgba(30, 41, 59, 0.45);
            --border: rgba(255, 255, 255, 0.08);
            --primary: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            padding: 3.5rem 3rem;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            max-width: 480px;
            width: 90%;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
        }

        h1 {
            background: var(--primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            letter-spacing: -0.5px;
        }

        p {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
            font-weight: 300;
        }

        .btn {
            background: var(--primary);
            color: var(--text-primary);
            border: none;
            padding: 1rem 2.5rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 14px rgba(168, 85, 247, 0.3);
            transition: all 0.2s ease;
            outline: none;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.4);
            filter: brightness(1.1);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            box-shadow: none;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            color: var(--text-primary);
            box-shadow: none;
            filter: none;
        }

        .badge {
            display: inline-block;
            background: rgba(168, 85, 247, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.3);
            color: #d8b4fe;
            padding: 0.35rem 0.85rem;
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #475569;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">OIDC Client Portal</div>
        <h1>PGW Autoglass MCP</h1>
        <p>Trigger the standard OpenID Connect Authorization Code Flow (with PKCE) to authenticate and access the Model Context Protocol server endpoints securely.</p>
        
        <div style="display: flex; flex-direction: column; gap: 0.75rem;">
            <button class="btn" onclick="login()">Authenticate via OIDC</button>
            <button class="btn btn-secondary" onclick="logout()">Log Out & Clear Session</button>
        </div>

        <div class="footer">Client: Python Web Server | Server Port: 5000</div>
    </div>

    <script>
        // --- PKCE Code Verification and Hashing Functions ---
        function dec2hex(dec) {
            return ('0' + dec.toString(16)).substr(-2);
        }

        function generateCodeVerifier() {
            var array = new Uint32Array(56 / 2);
            window.crypto.getRandomValues(array);
            return Array.from(array, dec2hex).join('');
        }

        function sha256(plain) {
            const encoder = new TextEncoder();
            const data = encoder.encode(plain);
            return window.crypto.subtle.digest('SHA-256', data);
        }

        function base64urlencode(a) {
            var str = "";
            var bytes = new Uint8Array(a);
            var len = bytes.byteLength;
            for (var i = 0; i < len; i++) {
                str += String.fromCharCode(bytes[i]);
            }
            return btoa(str)
                .replace(/\+/g, "-")
                .replace(/\//g, "_")
                .replace(/=+$/, "");
        }

        async function generateCodeChallenge(v) {
            var hashed = await sha256(v);
            return base64urlencode(hashed);
        }

        // --- Initiate OIDC Login Flow ---
        async function login() {
            // 1. Generate verifier and cache it locally in browser memory
            const verifier = generateCodeVerifier();
            localStorage.setItem("code_verifier", verifier);
            
            // 2. Generate SHA-256 challenge hash
            const challenge = await generateCodeChallenge(verifier);
            
            // 3. Dynamically determine client redirect_uri (works for python -m http.server on any port)
            const redirectUri = `${window.location.origin}/callback.html`;

            // 4. Construct Authorization Request URI pointing to the server (port 5000)
            const authUrl = `http://localhost:5000/connect/authorize?` +
                `client_id=mcp-client&` +
                `redirect_uri=${encodeURIComponent(redirectUri)}&` +
                `response_type=code&` +
                `scope=openid profile mcp offline_access&` +
                `code_challenge=${challenge}&` +
                `code_challenge_method=S256`;
                
            // 5. Redirect browser to server to authenticate the user
            window.location.href = authUrl;
        }

        // --- Log Out & Clear Server Cookies ---
        function logout() {
            localStorage.clear();
            const clientHome = encodeURIComponent(window.location.origin);
            window.location.href = `http://localhost:5000/logout?ReturnUrl=${clientHome}`;
        }
    </script>
</body>
</html>
